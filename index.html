<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dayline · Your day in focus</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2fb;background:#0b101a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#1b3450 0,transparent 55%),#0b101a;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 18px 90px}header,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:29px;margin:6px 0}h2{font-size:19px}small,.muted{color:#9eb0c5}.pill{padding:7px 12px;background:#23354a;border-radius:30px;color:#b9d9f7;font-size:12px}button,input,select{font:inherit}button{border:1px solid #38506a;background:#1b2a3c;color:#eaf2fb;border-radius:12px;padding:11px 14px;cursor:pointer}button:hover{background:#2b4561}.primary{background:#a5f2b7;color:#102118;border:0;font-weight:700}input,select{background:#142337;color:#fff;border:1px solid #38506a;border-radius:10px;padding:11px;width:100%}.hero{background:linear-gradient(140deg,#1e3850,#142332 65%,#192c35);border:1px solid #35506b;border-radius:28px;padding:26px;margin:24px 0;box-shadow:0 18px 45px #0004}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:#b5d4e6;font-size:11px;font-weight:700}.current{font-size:clamp(30px,7vw,47px);font-weight:750;margin:14px 0 4px}.clock{font-size:clamp(44px,11vw,76px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.06em;margin:16px 0}.track{height:9px;border-radius:20px;background:#3a4d5f;overflow:hidden;margin:20px 0}.fill{height:100%;background:#a5f2b7;width:0;transition:width .5s}.next{background:#ffffff0b;border:1px solid #ffffff1a;border-radius:16px;padding:16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.daynav{display:flex;gap:7px;overflow:auto;padding:4px 0}.daynav button{min-width:72px}.daynav button.active{background:#a5f2b7;color:#13211b}.item{display:flex;gap:14px;align-items:center;border:1px solid #273a4e;background:#121f2d;border-radius:17px;padding:14px;margin:9px 0}.item.now{border-color:#a5f2b7;background:#1a3436}.item.past{opacity:.55}.time{font-size:12px;color:#a9b9ca;min-width:92px;font-variant-numeric:tabular-nums}.item .name{font-weight:650}.item .desc{font-size:12px;color:#a7b8c8;margin-top:4px}.grow{flex:1}.actions{display:flex;gap:5px}.actions button{padding:8px}.note{font-size:12px;color:#8ea5ba;line-height:1.6}.modal{border:1px solid #4a6176;border-radius:20px;background:#162536;color:white;width:min(92vw,440px);padding:24px}.modal::backdrop{background:#000b}.field{display:block;margin:12px 0;font-size:13px}.field input{margin-top:6px}.footer{margin-top:30px;text-align:center;color:#728da4;font-size:12px}
</style></head><body><main><header><div><div class="eyebrow">● Make room for what matters</div><h1>Dayline <span style="color:#a5f2b7">✳</span></h1></div><span class="pill" id="live">LIVE</span></header><p class="muted" id="date"></p><nav class="daynav" id="days"></nav><section class="hero"><div class="between"><span class="eyebrow" id="status">RIGHT NOW</span><span class="pill" id="range"></span></div><div class="current" id="current">Loading…</div><div class="muted" id="description"></div><div class="clock" id="remaining">--:--</div><div class="muted" id="countlabel">remaining</div><div class="track"><div class="fill" id="progress"></div></div><div class="next"><div class="eyebrow">UP NEXT</div><div class="between" style="margin-top:9px"><strong id="next">—</strong><span id="nexttime" class="muted"></span></div></div></section><div class="between"><h2>Today's timeline</h2><span class="pill" id="count"></span></div><div class="toolbar"><button class="primary" id="add">+ Add activity</button><button id="copy">Copy day</button><button id="export">Export JSON</button><button id="ics">Calendar .ics</button><button id="csv">CSV</button><button id="import">Import JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div id="timeline"></div><div class="footer">Your rota is saved on this device · Export JSON to back up to iCloud Drive</div></main><dialog class="modal" id="editor"><form method="dialog" id="editform"><h2 id="editheading">Activity</h2><label class="field">Activity name<input name="name" required maxlength="80"></label><label class="field">Description<input name="desc" maxlength="180"></label><label class="field">Start<input name="start" type="time" required></label><label class="field">End<input name="end" type="time" required></label><div class="toolbar"><button class="primary" value="save">Save</button><button value="cancel">Cancel</button></div></form></dialog><script>
const key='dayline-v1',today=()=>new Date().toLocaleDateString('en-CA'),pad=n=>String(n).padStart(2,'0'),minutes=t=>{let [h,m]=t.split(':').map(Number);return h*60+m},iso=(d,t)=>d+'T'+t+':00',uid=()=>Math.random().toString(36).slice(2,10);
const blocks=[['08:00','08:35','🗂️ Morning planning','Review priorities and emails'],['08:35','08:45','🧘 Morning meditation','10-minute focus meditation'],['08:45','10:15','🎯 Focus block 1','Most demanding task'],['10:15','10:30','☕ Morning break','15 minutes, phone time'],['10:30','12:30','💻 Focus block 2','Project work and analysis'],['12:30','13:00','🥪 Lunch','Away from the desk'],['13:00','14:45','📋 Focus block 3','Emails, meetings and follow-ups'],['14:45','14:55','🧘 Afternoon meditation','10-minute breath meditation'],['14:55','15:10','☕ Afternoon break','15 minutes to reset'],['15:10','16:15','🎯 Focus block 4','Finish priority work'],['16:15','16:30','✅ Shutdown routine','Prepare for tomorrow'],['16:45','17:30','🏋️ Gym','45-minute workout'],['17:45','18:30','🍜 Chicken chow mein','Cook, eat and tidy'],['18:30','19:00','🚿 Free time','Relax and get ready'],['19:00','21:00','👥 Colin visiting','Evening with Colin']];
const asItems=a=>a.map(([start,end,name,desc])=>({id:uid(),start,end,name,desc}));
const initial=()=>{let o={};for(let d=9;d<=13;d++){let date='2026-11-'+pad(d);o[date]=d===9?asItems(blocks):d===13?asItems([['08:00','16:30','🌿 Out of office','Friday off']]):asItems(blocks.slice(0,11));}return o};
let data;try{data=JSON.parse(localStorage.getItem(key))||initial()}catch{data=initial()}let selected=today();const save=()=>localStorage.setItem(key,JSON.stringify(data));save();
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let day=new Date(selected+'T12:00:00'),now=new Date(),actual=selected===today(),n=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,items=(data[selected]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));$('date').textContent=day.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('days').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(day);d.setDate(d.getDate()+i-3);let k=d.toLocaleDateString('en-CA');return '<button class="'+(k===selected?'active':'')+'" data-date="'+k+'">'+d.toLocaleDateString('en-GB',{weekday:'short'})+'<br>'+d.getDate()+'</button>'}).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});let active=actual?items.find(x=>minutes(x.start)<=n&&n<minutes(x.end)):null,next=actual?items.find(x=>minutes(x.start)>n):items[0],past=actual?items.filter(x=>minutes(x.end)<=n).length:0;if(active){let left=Math.max(0,Math.ceil(minutes(active.end)*60-(now.getHours()*3600+now.getMinutes()*60+now.getSeconds()))),p=(n-minutes(active.start))/(minutes(active.end)-minutes(active.start))*100;$('status').textContent='RIGHT NOW';$('current').textContent=active.name;$('description').textContent=active.desc;$('remaining').textContent=pad(Math.floor(left/60))+':'+pad(left%60);$('countlabel').textContent='remaining in this activity';$('range').textContent=active.start+'–'+active.end;$('progress').style.width=Math.max(0,Math.min(100,p))+'%';}else{$('status').textContent=actual?'BETWEEN ACTIVITIES':'DAY OVERVIEW';$('current').textContent=actual?(next?'Free time':'All done for today'):'Your plan';$('description').textContent=actual?'Your next scheduled activity is below.':'Select today to see a live countdown.';$('remaining').textContent=actual&&next?pad(Math.floor(Math.max(0,minutes(next.start)-n)))+':'+pad(Math.floor((Math.max(0,minutes(next.start)-n)%1)*60)):'—';$('countlabel').textContent=actual?'until next activity':'';$('range').textContent='';$('progress').style.width=actual&&items.length?past/items.length*100+'%':'0%'}$('next').textContent=next?next.name:'Nothing else scheduled';$('nexttime').textContent=next?next.start:'';$('count').textContent=items.length+' activities';$('timeline').innerHTML=items.map(x=>'<div class="item '+(actual&&n>=minutes(x.end)?'past':actual&&x===active?'now':'')+'"><div class="time">'+esc(x.start)+'<br>'+esc(x.end)+'</div><div class="grow"><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.desc)+'</div></div><div class="actions"><button aria-label="Edit" data-edit="'+esc(x.id)+'">✎</button><button aria-label="Delete" data-del="'+esc(x.id)+'">×</button></div></div>').join('')||'<p class="muted">No activities yet. Add your first one.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this activity?')){data[selected]=items.filter(x=>x.id!==b.dataset.del);save();render()}})}
let editing=null;function edit(id){editing=id;let x=(data[selected]||[]).find(x=>x.id===id)||{name:'',desc:'',start:'09:00',end:'09:30'};for(let k of ['name','desc','start','end'])$('editform').elements[k].value=x[k];$('editheading').textContent=id?'Edit activity':'Add activity';$('editor').showModal()}$('add').onclick=()=>edit(null);$('editform').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;e.preventDefault();let f=$('editform').elements,x={id:editing||uid(),name:f.name.value.trim(),desc:f.desc.value.trim(),start:f.start.value,end:f.end.value};if(!x.name||minutes(x.end)<=minutes(x.start)){alert('Enter a name and an end time after the start.');return}data[selected]=(data[selected]||[]).filter(y=>y.id!==editing).concat(x);save();$('editor').close();render()});
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('export').onclick=()=>download('dayline-backup.json',JSON.stringify({version:1,days:data},null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text()),days=x.days||x;if(!days||typeof days!=='object'||!Object.values(days).every(v=>Array.isArray(v)&&v.every(x=>typeof x.name==='string'&&/^\d\d:\d\d$/.test(x.start)&&/^\d\d:\d\d$/.test(x.end))))throw Error('Invalid Dayline JSON');if(confirm('Replace your current rota with this backup?')){data=days;save();render()}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
$('copy').onclick=()=>{let target=prompt('Copy this day to date (YYYY-MM-DD):',selected);if(!target)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){alert('Use YYYY-MM-DD');return}if(data[target]?.length&&!confirm('Replace activities on '+target+'?'))return;data[target]=(data[selected]||[]).map(x=>({...x,id:uid()}));save();selected=target;render()};
$('csv').onclick=()=>{let rows=[['Date','Start','End','Activity','Description']];Object.entries(data).forEach(([d,arr])=>arr.forEach(x=>rows.push([d,x.start,x.end,x.name,x.desc])));download('dayline.csv',rows.map(row=>row.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
$('ics').onclick=()=>{let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dayline//EN'];Object.entries(data).forEach(([d,arr])=>arr.forEach(x=>{let fmt=t=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';lines.push('BEGIN:VEVENT','UID:'+x.id+'@dayline','DTSTART:'+fmt(x.start),'DTEND:'+fmt(x.end),'SUMMARY:'+x.name.replace(/[,;\n]/g,' '),'DESCRIPTION:'+(x.desc||'').replace(/[,;\n]/g,' '),'END:VEVENT')}));lines.push('END:VCALENDAR');download('dayline-calendar.ics',lines.join('\r\n'),'text/calendar')};render();setInterval(render,1000);
</script></body></html>
