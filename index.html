<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09121f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A compact, live rota and countdown to help you stay focused.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2.0">
  <title>Dayline | Your day in focus</title>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="logo" aria-hidden="true">✳</div>
      <div><div class="brand">Dayline</div><div class="subhead" id="topDate">Your day in focus</div></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="todayButton" title="Jump to today" aria-label="Jump to today">⌖</button>
      <button class="icon-btn" id="soundButton" title="Enable alert sounds" aria-label="Enable alert sounds">🔇</button>
      <button class="icon-btn" id="settingsButton" title="Rota and settings" aria-label="Rota and settings">⚙</button>
    </header>
    <div class="datebar" aria-label="Days of the selected week">
      <button class="nav-btn" id="prevWeek" aria-label="Previous week">‹</button>
      <nav id="days" class="days"></nav>
      <button class="nav-btn" id="nextWeek" aria-label="Next week">›</button>
    </div>
    <section class="hero" id="hero" aria-live="off" aria-label="Current activity">
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      <div class="hero-content">
        <div class="hero-head">
          <span id="statusText" class="kicker">RIGHT NOW</span>
          <span id="range" class="range"></span>
        </div>
        <div id="currentTitle" class="hero-name">Loading your day…</div>
        <div id="currentDesc" class="hero-desc"></div>
        <div id="countdown" class="hero-clock" aria-label="Time remaining"></div>
        <div id="countLabel" class="clock-label"></div>
        <div class="progress-track" aria-label="Progress through current activity"><div id="progress" class="progress-fill"></div></div>
        <div class="nextline">
          <div class="spacer" style="min-width:0"><div class="n-caption">UP NEXT</div><div class="n-title" id="nextName"></div></div>
          <div class="n-time" id="nextTime"></div>
        </div>
      </div>
    </section>
    <div class="status-line">
      <span id="dayStats"></span>
      <span id="liveFlag"><span class="status-dot"></span>LIVE</span>
    </div>
    <section id="ahead" class="upcoming" aria-label="Upcoming activities"></section>
    <div class="bottom"><span>Monday–Thursday · alternating Fridays off</span><button id="manageBottom" class="link-button" onclick="document.getElementById('settingsButton').click()">Manage rota</button></div>
  </main>

  <dialog id="settingsDialog" aria-label="Dayline settings">
    <div class="dialog-shell">
      <div class="dialog-header"><h2 id="panelTitle">Edit rota</h2><button class="icon-btn" id="panelClose" aria-label="Close settings">×</button></div>
      <div class="tabs" id="panelTabs">
        <button class="tab active" data-tab="day">✎ Rota</button>
        <button class="tab" data-tab="routine">↻ Repeat</button>
        <button class="tab" data-tab="alerts">♫ Alerts</button>
        <button class="tab" data-tab="backup">⇅ Backup</button>
      </div>
      <div class="panel-content" id="panelContent"></div>
    </div>
  </dialog>

  <dialog id="entryDialog" aria-label="Add or edit activity">
    <div class="dialog-shell" style="min-height:0">
      <div class="dialog-header"><h2 id="entryTitle">Edit activity</h2><button class="icon-btn" id="entryClose" aria-label="Close activity editor">×</button></div>
      <form id="entryForm" class="panel-content" method="dialog">
        <label class="field">Activity name<input type="text" name="name" maxlength="100" required placeholder="e.g. Focus block"></label>
        <label class="field">Description<input type="text" name="desc" maxlength="200" placeholder="Optional"></label>
        <div class="row">
          <label class="field" style="flex:1;min-width:0">Start<input type="time" name="start" required></label>
          <label class="field" style="flex:1;min-width:0">End<input type="time" name="end" required></label>
        </div>
        <label class="field">Activity type<select name="category"></select></label>
        <label class="field">Sound when starting<select name="sound"></select></label>
        <div class="row wrap" style="margin-top:16px">
          <button class="btn primary" type="submit" value="save">Save activity</button>
          <button class="btn" type="submit" value="cancel">Cancel</button>
        </div>
      </form>
    </div>
  </dialog>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <script src="app.js?v=2.0" defer></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
</body>
</html>
